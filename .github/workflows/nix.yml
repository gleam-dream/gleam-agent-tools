name: Nix tooling
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          determinate: false
          github-token: ""
      - run: nix flake check --no-update-lock-file --print-build-logs
      - name: Verify project environment selection with a live Nix store
        run: nix develop --command python nix/tests/test_mcp.py gleam-agent-lsp
